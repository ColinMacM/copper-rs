[package]
name = "cu-vla-loop"
description = "A policy-driven arm loop: a Python policy sends action chunks over Zenoh, the action governor gates them, a mock arm follows."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
cu29 = { workspace = true, features = ["reflect", "plugins"] }
cu-policy = { workspace = true, features = ["std", "link", "server"] }
cu-sensor-payloads = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }

[dev-dependencies]
cu29-export = { workspace = true }
cu29-unifiedlog = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
cu29-build = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["bincode", "serde"]

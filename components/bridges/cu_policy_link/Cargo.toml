[package]
name = "cu-policy-link"
description = "Copper bridge to an out-of-process policy over Zenoh: the cycle thread only copies, a worker thread does the I/O."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/cu-policy-link"

[package.metadata.copper]
kind = "bridge"
domains = ["middleware/zenoh"]
environments = ["host"]

[dependencies]
cu29 = { workspace = true }
cu-sensor-payloads = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
rtrb = "0.3.3"
zenoh = { workspace = true, default-features = false, features = ["transport_tcp"] }

[dev-dependencies]
cu-action-governor = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
cu29-build = { workspace = true }
